name: Android Google Play Deployment

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play 發布軌道'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: 'Release 狀態'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed
          - draft
      version_name:
        description: '顯示版本；留空時使用 frontend/package.json version'
        required: false
        type: string
  push:
    tags:
      # android-v* 只送內部測試軌道；android-prod-v* 直接送正式版審查。
      - 'android-v*'
      - 'android-prod-v*'

env:
  NODE_VERSION: '20.18.0'
  JAVA_VERSION: '17'
  PACKAGE_NAME: 'com.spacein'

permissions:
  contents: read

concurrency:
  group: google-play-com-spacein
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build、Deploy、Verify com.spacein
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # 手動 dispatch 以輸入為準；tag 觸發時由 tag 前綴決定軌道，預設維持 internal。
      RESOLVED_TRACK: ${{ inputs.track || (startsWith(github.ref_name, 'android-prod-v') && 'production' || 'internal') }}
      RESOLVED_STATUS: ${{ inputs.status || 'completed' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
          cache-dependency-path: |
            frontend/android/*.gradle
            frontend/android/gradle/wrapper/gradle-wrapper.properties

      - name: Validate required GitHub secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name:-}" ]; then
              echo "::error::GitHub Actions secret ${name} 未設定或為空"
              missing=1
            fi
          done
          [ "${missing}" -eq 0 ]

      - name: Build、deploy and verify Android release
        id: android-deploy
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLAY_TRACK: ${{ env.RESOLVED_TRACK }}
          GOOGLE_PLAY_RELEASE_STATUS: ${{ env.RESOLVED_STATUS }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
        run: scripts/android-release.sh deploy

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: com.spacein-${{ steps.android-deploy.outputs.version_code }}
          path: ${{ steps.android-deploy.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Write deployment summary
        env:
          TRACK: ${{ env.RESOLVED_TRACK }}
          RELEASE_STATUS: ${{ env.RESOLVED_STATUS }}
          VERSION_CODE: ${{ steps.android-deploy.outputs.version_code }}
          VERSION_NAME: ${{ steps.android-deploy.outputs.version_name }}
          COMMITTED_EDIT_ID: ${{ steps.android-deploy.outputs.committed_edit_id }}
        run: |
          {
            echo "## Android Google Play 部署成功"
            echo
            echo "- Package: \`${PACKAGE_NAME}\`"
            echo "- Version: \`${VERSION_NAME} (${VERSION_CODE})\`"
            echo "- Track: \`${TRACK}\`"
            echo "- Status: \`${RELEASE_STATUS}\`"
            echo "- Google Play edit: \`${COMMITTED_EDIT_ID}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
