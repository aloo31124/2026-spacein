name: Android Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store 發布軌道 (internal / alpha / beta / production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

env:
  NODE_VERSION: '20.18.0'
  JAVA_VERSION: '17'

jobs:
  build-and-deploy:
    name: Build Android AAB & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. 取得程式碼 ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. 設定 Node.js ────────────────────────────────────────
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ── 3. 設定 Java (Gradle 需要) ─────────────────────────────
      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # ── 4. 安裝前端依賴 ────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # ── 5. Angular Production Build ────────────────────────────
      - name: Build Angular (production)
        working-directory: frontend
        run: npm run build:prod

      # ── 6. Capacitor sync to Android ──────────────────────────
      - name: Capacitor sync Android
        working-directory: frontend
        run: npx cap sync android

      # ── 7. 解碼 Keystore 並建立 keystore.properties ───────────
      - name: Decode keystore
        working-directory: frontend/android
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release/keystore.jks
          cat > keystore.properties <<EOF
          storeFile=release/keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # ── 8. Gradle Build — Release AAB ─────────────────────────
      - name: Build release AAB
        working-directory: frontend/android
        run: ./gradlew bundleRelease --no-daemon
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ── 9. 上傳 AAB artifact（方便手動下載）────────────────────
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ── 10. 上傳至 Google Play Store ──────────────────────────
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.spacein
          releaseFiles: frontend/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
          whatsNewDirectory: .github/whatsnew

      # ── 11. 清除敏感檔案 ───────────────────────────────────────
      - name: Clean up keystore
        if: always()
        working-directory: frontend/android
        run: |
          rm -f app/release/keystore.jks
          rm -f keystore.properties
