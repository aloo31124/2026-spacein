# ====================================
# Space-in 空間預約系統 - GCP Cloud Build 自動部署
# 前後端一次部署至 Cloud Run
# ====================================
#
# 使用方式 (於專案根目錄執行):
#   # 前端 API domain 沿用 environment.prod.ts (預設、常用)
#   gcloud builds submit --config cloudbuild.yaml --project spacein-493210
#
#   # 需要改讓前端打本次部署的 spacein-server 時，才明確指定 _BACKEND_URL
#   gcloud builds submit --config cloudbuild.yaml --project spacein-493210 \
#       --substitutions=_BACKEND_URL=https://spacein-server-xxxxxxxxxx-de.a.run.app
#
# GCP 環境:
#   專案編號: 1025423218880
#   專案 ID : spacein-493210
#   區  域 : asia-east1
#   服  務 : spacein-server (後端), spacein-client (前端)
#
# 前置作業 (僅需執行一次):
#   gcloud auth login aloo31124@gmail.com
#   gcloud config set project spacein-493210
#   gcloud services enable cloudbuild.googleapis.com run.googleapis.com \
#       artifactregistry.googleapis.com containerregistry.googleapis.com
# ====================================

substitutions:
  _GCP_PROJECT_ID: spacein-493210
  _REGION: asia-east1
  _SERVER_SERVICE: spacein-server
  _CLIENT_SERVICE: spacein-client
  _SERVER_PORT: '8082'
  _CLIENT_PORT: '8080'
  # 前端呼叫的後端 API domain：
  #   留空 (預設) = 沿用 frontend/src/environments/environment.prod.ts 中設定的 domain
  #   有填值      = 建置時覆寫該 domain（例如要改打本次部署的 spacein-server 時才填）
  # 不可再自動帶入 spacein-server 的 Cloud Run URL，否則會蓋掉版控中的正式 API domain
  _BACKEND_URL: ''

steps:
  # ========== 後端部署 ==========
  # Step 1: 建置後端 Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${_GCP_PROJECT_ID}/${_SERVER_SERVICE}:latest'
      - './backend'
    id: 'build-server'

  # Step 2: 推送後端 Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/${_GCP_PROJECT_ID}/${_SERVER_SERVICE}:latest']
    id: 'push-server'
    waitFor: ['build-server']

  # Step 3: 部署後端至 Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVER_SERVICE}'
      - '--image=gcr.io/${_GCP_PROJECT_ID}/${_SERVER_SERVICE}:latest'
      - '--project=${_GCP_PROJECT_ID}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--port=${_SERVER_PORT}'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--timeout=300'
      - '--allow-unauthenticated'
      - '--set-env-vars=NODE_ENV=production'
    id: 'deploy-server'
    waitFor: ['push-server']

  # ========== 前端部署 ==========
  # Step 4: 建置前端 Docker Image
  # 預設不注入後端 URL，前端 API domain 一律以 environment.prod.ts 為準；
  # 僅在 _BACKEND_URL 有填值時才覆寫，避免部署後前端被改指向 spacein-server 的 Cloud Run URL
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - '-c'
      - |
        BACKEND_URL='${_BACKEND_URL}'
        if [ -n "$${BACKEND_URL}" ]; then
          echo "前端建置覆寫後端 URL: $${BACKEND_URL}"
        else
          echo "前端建置沿用 environment.prod.ts 既有 domain"
        fi
        docker build \
          --build-arg BACKEND_URL="$${BACKEND_URL}" \
          -t gcr.io/${_GCP_PROJECT_ID}/${_CLIENT_SERVICE}:latest \
          ./frontend
    id: 'build-client'
    waitFor: ['deploy-server']

  # Step 5: 推送前端 Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/${_GCP_PROJECT_ID}/${_CLIENT_SERVICE}:latest']
    id: 'push-client'
    waitFor: ['build-client']

  # Step 6: 部署前端至 Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_CLIENT_SERVICE}'
      - '--image=gcr.io/${_GCP_PROJECT_ID}/${_CLIENT_SERVICE}:latest'
      - '--project=${_GCP_PROJECT_ID}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--port=${_CLIENT_PORT}'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--allow-unauthenticated'
    id: 'deploy-client'
    waitFor: ['push-client']

  # Step 7: 顯示最終部署資訊
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        SERVER_URL=$(gcloud run services describe ${_SERVER_SERVICE} \
          --project=${_GCP_PROJECT_ID} --region=${_REGION} \
          --format='value(status.url)')
        CLIENT_URL=$(gcloud run services describe ${_CLIENT_SERVICE} \
          --project=${_GCP_PROJECT_ID} --region=${_REGION} \
          --format='value(status.url)')
        echo "===================================="
        echo "✅ 部署完成"
        echo "後端 (API)  : $${SERVER_URL}"
        echo "前端 (Web) : $${CLIENT_URL}"
        echo "前端實際呼叫的 API domain 以 environment.prod.ts 為準 (_BACKEND_URL='${_BACKEND_URL}')"
        echo "===================================="
    id: 'show-urls'
    waitFor: ['deploy-client']

images:
  - 'gcr.io/${_GCP_PROJECT_ID}/${_SERVER_SERVICE}:latest'
  - 'gcr.io/${_GCP_PROJECT_ID}/${_CLIENT_SERVICE}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: '1800s'
