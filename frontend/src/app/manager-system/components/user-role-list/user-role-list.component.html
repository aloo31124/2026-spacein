<div class="search-bar">
    <button (click)="exportAllUser()">匯出使用者角色</button>
    <br>
    <input type="text" placeholder="使用者信箱不限" [(ngModel)]="searchMail">
    <span>並且</span>
    <input type="text" placeholder="角色名稱不限" [(ngModel)]="searchRole">
    <br>
    <button (click)="searchUser()">搜尋</button>
</div>

<!-- 搜尋結果列表 -->
<div class="search-result">
    <div class="manager-table-state" *ngIf="isDefault">開始搜尋</div>
    <div class="manager-table-state" *ngIf="userRoleList.length === 0 && !isDefault && !isLoading">沒有找到結果</div>
    <div class="manager-table-container" *ngIf="userRoleList.length > 0">
        <table class="manager-table">
            <thead>
                <tr>
                    <th scope="col">使用者 ID</th>
                    <th scope="col">信箱</th>
                    <th scope="col">角色</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let userRole of userRoleList">
                    <td data-label="使用者 ID">{{ userRole.userId }}</td>
                    <td data-label="信箱">{{ userRole.email }}</td>
                    <td data-label="角色">{{ userRole.role }}</td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="loading-gif" *ngIf="isLoading">
        <img src="assets/images/icon/icon_loading.gif" style="width: 50px;">
    </div>
</div>
