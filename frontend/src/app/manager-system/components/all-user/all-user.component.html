
<div class="search-bar">
    <button (click)="exportAllUser()">匯出所有使用者</button>
    <br>
    <input type="text" placeholder="使用者帳號不限" [(ngModel)]="searchName">
    <span>並且</span>
    <input type="text" placeholder="使用者信箱不限" [(ngModel)]="searchMail">
    <br>
    <button (click)="searchUser()">搜尋</button>
</div>
<!-- 搜尋結果列表 -->
<div class="search-result">
    <div class="manager-table-state" *ngIf="isDefault">開始搜尋</div>
    <div class="manager-table-state" *ngIf="users.length === 0 && !isDefault && !isLoading">沒有找到結果</div>
    <div class="manager-table-container" *ngIf="users.length > 0">
        <table class="manager-table">
            <thead>
                <tr>
                    <th scope="col">使用者 ID</th>
                    <th scope="col">姓名</th>
                    <th scope="col">信箱</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let user of users">
                    <td data-label="使用者 ID">{{ user.id }}</td>
                    <td data-label="姓名">{{ user.name }}</td>
                    <td data-label="信箱">{{ user.email }}</td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="loading-gif" *ngIf="isLoading">
        <img src="assets/images/icon/icon_loading.gif" style="width: 50px;">
    </div>
</div>
