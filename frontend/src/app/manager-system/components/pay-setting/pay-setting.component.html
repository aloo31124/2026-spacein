<button (click)="clickAddPayment()">新增</button>
<button (click)="exportAllPayment()">匯出方案</button>
<div class="search-bar">
    <input type="text" placeholder="方案名稱不限" [(ngModel)]="planName">
    <span>並且</span>
    <input type="text" placeholder="方案期限不限" [(ngModel)]="planTimeType">
    <span>並且</span>
    <input type="text" placeholder="方案種類不限" [(ngModel)]="planType">
    <br>
    <br>
    <button (click)="searchPayment()">搜尋</button>
</div>
<!-- 搜尋結果列表 -->
<div class="search-result">
    <div class="manager-table-state" *ngIf="isFirstSearch">開始搜尋</div>
    <div class="manager-table-state" *ngIf="paymentList.length === 0 && !isFirstSearch">沒有找到結果</div>
    <div class="manager-table-container" *ngIf="paymentList.length > 0">
        <table class="manager-table">
            <thead>
                <tr>
                    <th scope="col">名稱</th>
                    <th scope="col">時段</th>
                    <th scope="col">種類</th>
                    <th scope="col">操作</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let payment of paymentList">
                    <td data-label="名稱">{{ payment.planName }}</td>
                    <td data-label="時段">{{ payment.planTimeType }}</td>
                    <td data-label="種類">{{ payment.planType }}</td>
                    <td data-label="操作">
                        <div class="manager-table__actions">
                            <button (click)="clickEditPayment(payment)" [style.opacity]="payment.haveBuy ? 0.5 : 1">編輯</button>
                            <button (click)="clickDeletePayment(payment)" [style.opacity]="payment.haveBuy ? 0.5 : 1">刪除</button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
