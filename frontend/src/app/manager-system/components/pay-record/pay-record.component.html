<div class="search-bar">
    <button (click)="clickExportPayRecord()">匯出所有方案紀錄</button>
    <br>
    <input type="text" placeholder="購買者信箱不限" [(ngModel)]="searchMail">
    <span>並且</span>
    <input type="text" placeholder="方案名稱不限" [(ngModel)]="searchPlanName">
    <br>
    <button (click)="clickSearchPayRecord()">搜尋</button>
</div>

<!-- 搜尋結果列表 -->
<div class="search-result">
    <div class="manager-table-state" *ngIf="isDefault">開始搜尋</div>
    <div class="manager-table-state" *ngIf="payRecordList.length === 0 && !isDefault && !isLoading">沒有找到結果</div>
    <div class="manager-table-container" *ngIf="payRecordList.length > 0">
        <table class="manager-table">
            <thead>
                <tr>
                    <th scope="col">購買者信箱</th>
                    <th scope="col">方案名稱</th>
                    <th scope="col">資訊</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let payRecord of payRecordList">
                    <td data-label="購買者信箱">{{ payRecord.email }}</td>
                    <td data-label="方案名稱">{{ payRecord.planName }}</td>
                    <td data-label="資訊">{{ payRecord.message }}</td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="loading-gif" *ngIf="isLoading">
        <img src="assets/images/icon/icon_loading.gif" style="width: 50px;">
    </div>
</div>
