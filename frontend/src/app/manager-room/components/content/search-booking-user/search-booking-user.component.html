<div class="search-bar">
    <button (click)="exportUserList()">匯出預約者</button>
    <br>
    <input type="text" placeholder="預約者帳號不限" [(ngModel)]="searchName">
    <span>並且</span>
    <input type="text" placeholder="預約者信箱不限" [(ngModel)]="searchMail">
    <br>
    <button (click)="searchUser()">搜尋</button>
</div>

<!-- 搜尋結果列表 -->
<div class="search-result">
    <div class="result-state" *ngIf="isDefault">開始搜尋</div>
    <div class="result-state" *ngIf="users.length === 0 && !isDefault && !isLoading">沒有找到結果</div>
    <div class="manager-table-shell" *ngIf="users.length > 0">
        <table class="manager-table">
            <caption>預約者搜尋結果</caption>
            <thead>
                <tr>
                    <th scope="col">擁有者 ID</th>
                    <th scope="col">擁有者姓名</th>
                    <th scope="col">擁有者信箱</th>
                    <th scope="col">預約者 ID</th>
                    <th scope="col">預約者姓名</th>
                    <th scope="col">預約者信箱</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let user of users">
                    <td data-label="擁有者 ID">{{ user.ownerId }}</td>
                    <td data-label="擁有者姓名">{{ user.ownerName }}</td>
                    <td data-label="擁有者信箱">{{ user.ownerEmail }}</td>
                    <td data-label="預約者 ID">{{ user.id }}</td>
                    <td data-label="預約者姓名">{{ user.name }}</td>
                    <td data-label="預約者信箱">{{ user.email }}</td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="loading-gif" *ngIf="isLoading">
        <img src="assets/images/icon/icon_loading.gif" style="width: 50px;">
    </div>
</div>
