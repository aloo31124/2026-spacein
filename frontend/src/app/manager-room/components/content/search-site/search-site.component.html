<button (click)="clickAddSite()">新增座位</button>
<button (click)="clickExportSite()">匯出座位</button>
<div class="search-bar">
    <input type="text" placeholder="所屬教室名稱不限" [(ngModel)]="searchRoomName">
    <span>並且</span>
    <input type="text" placeholder="座位名稱不限" [(ngModel)]="searchSiteName">
    <br>
    <!--
    <span>並且 建立日期 搜尋範圍:</span>
    <input type="text" placeholder="範圍開始日不限">
    ~
    <input type="text" placeholder="範圍結束日不限">
    <br>
    -->
    <button (click)="searchSite()">搜尋</button>
</div>

<!-- 搜尋結果列表 -->
<div class="search-result">
    <div class="manager-table-state" *ngIf="isDefault">開始搜尋</div>
    <div class="manager-table-state" *ngIf="siteList.length === 0 && !isDefault && !isLoading">沒有找到結果</div>
    <div class="manager-table-container" *ngIf="siteList.length > 0">
        <table class="manager-table">
            <thead>
                <tr>
                    <th scope="col">擁有者 ID</th>
                    <th scope="col">擁有者信箱</th>
                    <th scope="col">教室名稱</th>
                    <th scope="col">座位名稱</th>
                    <th scope="col">操作</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let roomToSite of siteList">
                    <td data-label="擁有者 ID">{{ roomToSite.ownerId }}</td>
                    <td data-label="擁有者信箱">{{ roomToSite.email }}</td>
                    <td data-label="教室名稱">{{ roomToSite.roomName }}</td>
                    <td data-label="座位名稱">{{ roomToSite.name }}</td>
                    <td data-label="操作">
                        <div class="manager-table__actions">
                            <button (click)="clickEditSite(roomToSite)" [style.opacity]="roomToSite.haveBooking ? 0.5 : 1">編輯</button>
                            <button (click)="clickDeleteSite(roomToSite)" [style.opacity]="roomToSite.haveBooking ? 0.5 : 1">刪除</button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="loading-gif" *ngIf="isLoading">
        <img src="assets/images/icon/icon_loading.gif" style="width: 50px;">
    </div>
</div>
