<button (click)="clickExportBooking()">匯出預約紀錄</button>
<div class="search-bar">
    <input type="text" placeholder="預約教室名稱不限" [(ngModel)]="roomName">
    <span>並且</span>
    <input type="text" placeholder="預約座位名稱不限" [(ngModel)]="siteName">
    <br>
    <br>
    <span>並且 預約日期 範圍:</span>
    <input type="text" placeholder="範圍開始日不限" [(ngModel)]="startDateMin">
    <span>~</span>
    <input type="text" placeholder="範圍結束日不限" [(ngModel)]="startDateMax">
    <br>
    <button (click)="clickSearchBooking()">搜尋</button>
</div>

<!-- 搜尋結果列表 -->
<div class="search-result">
    <div class="manager-table-state" *ngIf="isDefault">開始搜尋</div>
    <div class="manager-table-state" *ngIf="bookingList.length === 0 && !isDefault && !isLoading">沒有找到結果</div>
    <div class="manager-table-container" *ngIf="bookingList.length > 0">
        <table class="manager-table">
            <thead>
                <tr>
                    <th scope="col">預約者信箱</th>
                    <th scope="col">教室名稱</th>
                    <th scope="col">座位名稱</th>
                    <th scope="col">預約日期</th>
                    <th scope="col">預約時間</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let booking of bookingList">
                    <td data-label="預約者信箱">{{ booking.mail }}</td>
                    <td data-label="教室名稱">{{ booking.roomName }}</td>
                    <td data-label="座位名稱">{{ booking.siteName }}</td>
                    <td data-label="預約日期">{{ booking.startDate }}</td>
                    <td data-label="預約時間">{{ booking.startTime }} ~ {{ booking.endTime }}</td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="loading-gif" *ngIf="isLoading">
        <img src="assets/images/icon/icon_loading.gif" style="width: 50px;">
    </div>
</div>
