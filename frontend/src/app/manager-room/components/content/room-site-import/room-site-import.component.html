<h2>匯入教室座位</h2>
<p>1. 所有欄位為 必填欄位。(參考 [匯出範本] )</p>
<p>2. 教室名稱 與 座位名稱 若都存在於系統, 則該筆資料不匯入。 </p>
<p>3. 教室名稱 若不存在於系統, 將自動新增該 教室 與 座位。 </p>
<p>4. 教室名稱 若已存在系統, 該 座位 直接新增於該 教室 下。 </p>


<button (click)="clickSampleToCsv()">匯出範本</button>
<input
  type="file"
  (change)="handleFiles($event)"
  multiple
  accept=".csv"
  style="display: none"
  #csvFileInput
/>
<button (click)="csvFileInput.click()">匯入教室座位</button>

<h2>匯入結果</h2>
<div class="search-result">
  <div class="result-state" *ngIf="resultList.length === 0 && !isLoading">尚無資料</div>
  <div class="manager-table-shell" *ngIf="resultList.length !== 0 && !isLoading">
    <table class="manager-table">
      <caption>教室座位匯入結果</caption>
      <thead>
        <tr>
          <th scope="col">項次</th>
          <th scope="col">匯入結果</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let result of resultList; let i = index">
          <td data-label="項次">{{ i + 1 }}</td>
          <td data-label="匯入結果">{{ result.message }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<div class="loading-gif" *ngIf="isLoading">
    <img src="assets/images/icon/icon_loading.gif" style="width: 50px;">
</div>
