<button (click)="clickAddRoom()">新增教室</button>
<button (click)="clickExportRoom()">匯出教室</button>
<div class="search-bar">
    <input type="text" placeholder="教室名稱不限" [(ngModel)]="searchRoomName">
    <br>
    <button (click)="clickSearchRoom()">搜尋</button>
</div>

<!-- 搜尋結果列表 -->
<div class="search-result">
    <div class="result-state" *ngIf="isDefault">開始搜尋</div>
    <div class="result-state" *ngIf="roomList.length === 0 && !isDefault && !isLoading">沒有找到結果</div>
    <div class="manager-table-shell" *ngIf="roomList.length > 0">
        <table class="manager-table">
            <caption>教室搜尋結果</caption>
            <thead>
                <tr>
                    <th scope="col">擁有者 ID</th>
                    <th scope="col">擁有者信箱</th>
                    <th scope="col">教室名稱</th>
                    <th scope="col">不開放日期</th>
                    <th scope="col">開放時段</th>
                    <th scope="col">操作</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let room of roomList">
                    <td data-label="擁有者 ID">{{ room.ownerId }}</td>
                    <td data-label="擁有者信箱">{{ room.email }}</td>
                    <td data-label="教室名稱">{{ room.name }}</td>
                    <td data-label="不開放日期">{{ room.closedWeekdaysText }}</td>
                    <td data-label="開放時段">{{ room.openTimeText }}</td>
                    <td class="table-actions" data-label="操作">
                        <div class="table-action-group">
                            <button class="table-action" (click)="clickEditRoom(room)" [style.opacity]="room.haveSite ? 0.5 : 1">編輯</button>
                            <button class="table-action" (click)="clickDeleteRoom(room)" [style.opacity]="room.haveSite ? 0.5 : 1">刪除</button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="loading-gif" *ngIf="isLoading">
        <img src="assets/images/icon/icon_loading.gif" style="width: 50px;">
    </div>
</div>
