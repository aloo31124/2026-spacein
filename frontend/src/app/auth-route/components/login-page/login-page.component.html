<div class="container">
    <img class="logo-img" src="assets/images/logo/logo.png">
    <app-img-btn 
        [imgUrl]="'assets/images/button/btn_google-auth.png'" 
        [btnText]="''" (click)="clickSignIn()">
    </app-img-btn>
    或
    <input [(ngModel)]="email" type="text" placeholder="輸入信箱">
    <input [(ngModel)]="password" type="password" placeholder="密碼">
    <div class="row">
        <button (click)="clickLogin()" >登入</button>
        <button (click)="clickForgetPassword()">忘記密碼</button>
    </div>
    或
    <div class="row">
        <button (click)="clickRegister()">註冊</button>
    </div>
    <app-version></app-version>

    <!-- 畫面 loading 中 -->
    <div class="loading-container">
        <app-loading-basic [isLoading]="isLoading">
        </app-loading-basic>
    </div>
</div>
