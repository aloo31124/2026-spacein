<div class="container">
    <img class="logo-img" src="assets/images/logo/logo.png">
    <app-img-btn 
        [imgUrl]="'assets/images/button/btn_google-auth.png'" 
        [btnText]="''" (click)="clickSignIn()">
    </app-img-btn>
    或
    <input [(ngModel)]="email" type="text" placeholder="輸入信箱">
    <div class="password-field">
        <input [(ngModel)]="password" [type]="showPassword ? 'text' : 'password'" placeholder="密碼">
        <button type="button" class="toggle-password" (click)="togglePassword()"
            [attr.aria-label]="showPassword ? '隱藏密碼' : '顯示密碼'"
            [attr.title]="showPassword ? '隱藏密碼' : '顯示密碼'">
            <!-- 顯示中: 眼睛圖示 -->
            <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                <circle cx="12" cy="12" r="3" />
            </svg>
            <!-- 隱藏中: 斜線眼睛圖示 -->
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
        </button>
    </div>
    <div class="row">
        <button (click)="clickLogin()" >登入</button>
        <button (click)="clickForgetPassword()">忘記密碼</button>
    </div>
    或
    <div class="row">
        <button (click)="clickRegister()">註冊</button>
    </div>
    <app-version></app-version>

    <!-- 畫面 loading 中 -->
    <div class="loading-container">
        <app-loading-basic [isLoading]="isLoading">
        </app-loading-basic>
    </div>
</div>
