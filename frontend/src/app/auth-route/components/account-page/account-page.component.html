
<div class="form-container">
    <div class="row">
        姓名: {{ currentUser.name }}
    </div>
    <div class="row">
        信箱: {{ currentUser.email }}
    </div>
    <button (click)="loginOut()">登出</button>

    <!-- 擁有者預設資料 (Owner 表): 僅擁有者顯示, 供教室新增時帶入 -->
    <div class="owner-profile-container" *ngIf="isOwner">
        <h3>擁有者預設資料</h3>
        <div class="field-row">
            <span class="field-title">預設地址:</span>
            <input type="text" [(ngModel)]="ownerProfile.address" placeholder="輸入預設地址">
        </div>
        <div class="field-row">
            <span class="field-title">預設電話:</span>
            <input type="text" [(ngModel)]="ownerProfile.phone" placeholder="輸入預設電話">
        </div>
        <div class="field-row">
            <span class="field-title">預設每周不開放時段:</span>
            <div class="weekly-day-bar">
                <label *ngFor="let day of weeklyDayOptions">
                    <input type="checkbox" [(ngModel)]="day.checked">{{ day.label }}
                </label>
            </div>
        </div>
        <div class="field-row">
            <span class="field-title">預設每天開放時段:</span>
            <div class="open-time-bar">
                <input type="time" [(ngModel)]="ownerProfile.openStartTime">
                <span class="time-sep">~</span>
                <input type="time" [(ngModel)]="ownerProfile.openEndTime">
            </div>
        </div>
        <button (click)="clickSaveOwnerProfile()">儲存預設資料</button>
    </div>

    <app-check-payment [isFromAccountPage]="true">
    </app-check-payment>

    <app-version></app-version>

    <!-- dialog 確認刪除 -->
    <div class="delete-container">

        <h3>刪除帳號確認</h3>
        <p>
            確認刪除個人帳號?
            <br>
            若刪除, 預約與其他紀錄將無法復原。
        </p>
        <h3>確定刪除, 請輸入當前帳號信箱</h3>
        <input type="text" #deleteAccountInput placeholder="輸入信箱">
        <button (click)="deleteAccount(deleteAccountInput.value)">確定刪除帳號</button>
    </div>

</div>
