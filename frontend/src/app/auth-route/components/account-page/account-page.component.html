
<div class="form-container">
    <div class="row">
        姓名: {{ currentUser.name }}
    </div>
    <div class="row">
        信箱: {{ currentUser.email }}
    </div>
    <button (click)="loginOut()">登出</button>

    <!-- [擁有者預設] 共用區塊, 僅擁有者顯示 -->
    <div class="owner-default-container" *ngIf="isOwner">
        <h3>擁有者預設</h3>
        <app-owner-default-form [form]="ownerDefault" labelPrefix="預設"></app-owner-default-form>
        <button (click)="saveOwnerDefault()">儲存預設資料</button>
    </div>

    <app-check-payment [isFromAccountPage]="true">
    </app-check-payment>

    <app-version></app-version>

    <!-- dialog 確認刪除 -->
    <div class="delete-container">

        <h3>刪除帳號確認</h3>
        <p>
            確認刪除個人帳號?
            <br>
            若刪除, 預約與其他紀錄將無法復原。
        </p>
        <h3>確定刪除, 請輸入當前帳號信箱</h3>
        <input type="text" #deleteAccountInput placeholder="輸入信箱">
        <button (click)="deleteAccount(deleteAccountInput.value)">確定刪除帳號</button>
    </div>

</div>
