
<div class="calendar-picker">

    <!-- 標題列: 上/下月導覽 (超出可選區間自動停用) + 年月 + 回今日 -->
    <div class="calendar-header">
        <button type="button" class="nav-btn" (click)="backMonth()"
                [disabled]="!canGoBackMonth" aria-label="上個月" title="上個月">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M14.5 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.5"
                      stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>

        <div class="header-title">
            <span class="year-month">{{ currentYear }} 年 {{ currentMonth }} 月</span>
            <button type="button" class="today-btn" *ngIf="!isDisplayTodayMonth()"
                    (click)="goToday()" aria-label="回到今日">回今日</button>
        </div>

        <button type="button" class="nav-btn" (click)="nextMonth()"
                [disabled]="!canGoNextMonth" aria-label="下個月" title="下個月">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9.5 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5"
                      stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>
    </div>

    <div class="calendar-content"
         [class.month-next]="monthTransitionDirection === 'next'"
         [class.month-previous]="monthTransitionDirection === 'previous'"
         (pointerdown)="onCalendarPointerDown($event)"
         (pointerup)="onCalendarPointerUp($event)"
         (pointercancel)="onCalendarPointerCancel()">
        <!-- 月份 key 改變時重建此層 DOM，讓每次按鈕／拖曳換月都重新播放進場動畫。 -->
        <div class="month-view" *ngFor="let monthViewKey of monthViewKeys">
            <!-- 星期列 -->
            <div class="grid-row weekday-row">
                <div class="grid weekday" *ngFor="let name of weekdayNames">{{ name }}</div>
            </div>

            <!-- 日格: 顯示資訊已於 dayCells 預先計算, template 不再反覆呼叫函式 -->
            <div class="grid-row">
                <div class="grid"
                    *ngFor="let cell of dayCells; trackBy: trackByIndex"
                    [class.invalid]="cell.day > 0 && !cell.isValid"
                    [class.blank]="cell.day === 0"
                    [attr.role]="cell.day > 0 ? 'button' : null"
                    [attr.tabindex]="cell.isValid ? 0 : null"
                    [attr.aria-label]="cell.day > 0 ? currentYear + '年' + currentMonth + '月' + cell.day + '日' : null"
                    [attr.aria-disabled]="cell.day > 0 && !cell.isValid ? true : null"
                    (click)="selectDate(cell.day)"
                    (keydown.enter)="selectDate(cell.day)"
                    (keydown.space)="selectDate(cell.day); $event.preventDefault()">

                    <!-- 顯示該行事曆該日文字 (Cypress 依賴 .no-selected 選取日期, 類名不可改) -->
                    <div class="no-selected" *ngIf="cell.day > 0"
                         [ngClass]="{
                                        'current-date': cell.isToday && cell.isValid,
                                        'selected': checkSelectDayStyle(cell.day)
                                    }">
                            {{ cell.day }}
                    </div>

                    <!-- 顯示 booking 紀錄 dot小點（已預約一律深紫色，樣式定義於 scss .dot） -->
                    <div class="dot-bar" *ngIf="cell.dotCount <= 3; else moreTemplate;">
                        <div class="dot" *ngFor="let dot of [].constructor(cell.dotCount)"></div>
                    </div>
                    <ng-template #moreTemplate>
                        <div class="more-word">
                            more...
                        </div>
                    </ng-template>

                    <!-- 顯示 剩餘率% -->
                    <div class="rate" *ngIf="rateList.length > 0">
                        {{ cell.rateText }}
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
