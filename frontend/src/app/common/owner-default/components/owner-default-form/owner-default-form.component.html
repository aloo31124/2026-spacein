<div class="owner-default-form">

    <div class="field-row">
        <label class="field-label">{{ labelPrefix }}地址</label>
        <input type="text" [(ngModel)]="form.address" placeholder="請輸入地址">
    </div>

    <div class="field-row">
        <label class="field-label">{{ labelPrefix }}電話</label>
        <input type="text" [(ngModel)]="form.phone" placeholder="請輸入電話">
    </div>

    <div class="field-row">
        <label class="field-label">{{ labelPrefix }}每周不開放</label>
        <div class="weekday-list">
            <label class="weekday-item"
                   [class.checked]="isClosedWeekday(i)"
                   *ngFor="let name of weekdayNames; let i = index">
                <input type="checkbox"
                       [checked]="isClosedWeekday(i)"
                       (change)="toggleClosedWeekday(i)">
                {{ name }}
            </label>
        </div>
    </div>

    <div class="field-row">
        <label class="field-label">{{ labelPrefix }}每天開放時段</label>
        <div class="time-range">
            <input type="time" [(ngModel)]="form.openStartTime">
            <span>~</span>
            <input type="time" [(ngModel)]="form.openEndTime">
        </div>
    </div>

</div>
