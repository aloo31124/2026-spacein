
<div class="clock-page-container">

    <div class="input-bar">
        <app-input class="time-input"
            (inputClick)="selectStartInput()"
            [inputContent]="getStartTime()"
            [isSelect]="isSelectStartTimeInput"
            [inputTitle]="'開始時間:'">
        </app-input>
        <app-input class="time-input"
            (inputClick)="selectEndInput()"
            [inputContent]="getEndTime()"
            [isSelect]="!isSelectStartTimeInput"
            [inputTitle]="'結束時間:'">
        </app-input>
    </div>

    <!-- 共用時鐘元件: 時鐘面同步顯示目前選取欄位之時間; 預約最小單位 1 小時, 分鐘不可選 -->
    <app-clock-picker
        [time]="getActiveTime()"
        [isMinuteEnabled]="false"
        (timeChange)="onTimeChange($event)">
    </app-clock-picker>

    <!-- [教室時段卡控] 提醒: 所選時段 有教室卡控時, 即時顯示教室與原因 -->
    <div class="room-open-hint" *ngIf="timeRuleHintList.length > 0">
        <div class="hint-title">所選時段下列教室不可預約：</div>
        <div class="hint-reason-row" *ngFor="let hint of timeRuleHintList">
            <span class="hint-room">{{ hint.roomName }}</span>{{ hint.reason }}
        </div>
    </div>

    <div class="btn-bar booking-bottom-action">
        <!-- 下一步：改用 inline SVG（取代 icon_next.png），跨平台渲染一致 -->
        <button type="button" class="next-btn" (click)="nextStep()" aria-label="下一步" title="下一步">
            <svg viewBox="0 0 48 48" aria-hidden="true">
                <circle cx="24" cy="24" r="22" fill="#661983" />
                <path d="M20 16l8 8-8 8" fill="none" stroke="#ffffff" stroke-width="3"
                      stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>
    </div>

</div>
