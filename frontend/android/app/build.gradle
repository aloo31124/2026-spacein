apply plugin: 'com.android.application'

// 讀取 keystore.properties（存放於 android/ 根目錄，不納入版控）
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def environmentKeystoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
def environmentSigningConfigured = environmentKeystoreFile &&
        System.getenv("KEYSTORE_PASSWORD") &&
        System.getenv("KEY_ALIAS") &&
        System.getenv("KEY_PASSWORD")
def propertySigningConfigured = keystorePropertiesFile.exists() &&
        keystoreProperties['storeFile'] &&
        keystoreProperties['storePassword'] &&
        keystoreProperties['keyAlias'] &&
        keystoreProperties['keyPassword']
def releaseSigningConfigured = environmentSigningConfigured || propertySigningConfigured
def configuredVersionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "20").toInteger()
def configuredVersionName = System.getenv("ANDROID_VERSION_NAME") ?: "1.20"

android {
    namespace "com.spacein"
    compileSdkVersion rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.spacein"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI 由 Google Play API 查詢目前最大版本後注入，避免重複 versionCode。
        versionCode configuredVersionCode
        versionName configuredVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (environmentSigningConfigured) {
                // 自動部署使用暫存金鑰檔；腳本結束後立即刪除，不寫入專案目錄。
                storeFile file(environmentKeystoreFile)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            } else if (propertySigningConfigured) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }
}

// release 產物若沒有 upload key 簽章，Google Play 必定拒絕；在昂貴建置前直接失敗。
gradle.taskGraph.whenReady { taskGraph ->
    def buildsRelease = taskGraph.allTasks.any {
        it.project == project && it.name in ['bundleRelease', 'assembleRelease']
    }
    if (buildsRelease && !releaseSigningConfigured) {
        throw new GradleException(
                "Release 簽章未設定。請使用 scripts/android-release.sh，" +
                "或建立未納入版控的 android/keystore.properties。")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
