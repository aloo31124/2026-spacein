<div class="search-bar">
    <button (click)="exportAllUser()">匯出使用者角色</button>
    <br>
    <input type="text" placeholder="使用者信箱不限" [(ngModel)]="searchMail">
    <span>並且</span>
    <input type="text" placeholder="角色名稱不限" [(ngModel)]="searchRole">
    <br>
    <button (click)="searchUser()">搜尋</button>
</div>

<!-- 搜尋結果列表 -->
<div class="search-result">
    <div *ngIf="isDefault">開始搜尋</div>
    <div *ngIf="userRoleList.length === 0 && !isDefault && !isLoading">沒有找到結果</div>
    <ul *ngIf="userRoleList.length > 0">
        <li *ngFor="let userRole of userRoleList">
            <strong>id:</strong> {{ userRole.userId }} |
            <strong>信箱:</strong> {{ userRole.email }} |
            <strong>角色:</strong> {{ userRole.role }}
        </li>
    </ul>
    <div class="loading-gif" *ngIf="isLoading">
        <img src="assets/images/icon/icon_loading.gif" style="width: 50px;">
    </div>
</div>
