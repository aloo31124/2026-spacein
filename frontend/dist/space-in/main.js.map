<div class="container">
    請送出驗證信箱
    <input type="text" placeholder="輸入驗證信箱" [(ngModel)]="mail">
    <button (click)="sendMail()">送出</button>

    <!-- 畫面 loading 中 -->
    <div class="loading-container">
        <app-loading-basic [isLoading]="isLoading">
        </app-loading-basic>
    </div>
</div>
